---
# ============================================================
# EJERCICIO INTEGRADOR KUBERNETES - PARTE 1
# DevOps - TSIC2 | Fecha: Noviembre 2026
# Despliega: Namespace, ServiceAccount, ConfigMap, Secret,
#            Deployment (3 replicas), Service NodePort
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: mi-app
  labels:
    env: demo
    team: devops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mi-app-sa
  namespace: mi-app

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mi-app-config
  namespace: mi-app
data:
  APP_ENV: "demo"
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Kubernetes Demo</title>
    <style>
      body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
      .card { background: #16213e; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: 500px; }
      h1 { color: #0f9b58; font-size: 2em; }
      .badge { background: #0f9b58; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8em; margin: 4px; display: inline-block; }
    </style>
    </head>
    <body>
    <div class="card">
      <h1>&#x2705; ¡Hola desde Kubernetes!</h1>
      <p>Desplegada con:</p>
      <span class="badge">Namespace</span>
      <span class="badge">ServiceAccount</span>
      <span class="badge">ConfigMap</span>
      <span class="badge">Secret</span>
      <span class="badge">Deployment</span>
      <span class="badge">Service NodePort</span>
      <p style="margin-top:20px; color:#aaa; font-size:0.85em;">DevOps TSIC2 &bull; Rocky Linux 10 &bull; Kubernetes v1.31.14</p>
    </div>
    </body>
    </html>

---
apiVersion: v1
kind: Secret
metadata:
  name: mi-app-secret
  namespace: mi-app
type: Opaque
data:
  API_KEY: c3VwZXItc2VjcmV0LWFwaS1rZXktMTIzNDU=   # super-secret-api-key-12345

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mi-app-deployment
  namespace: mi-app
  labels:
    app: mi-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mi-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mi-app
    spec:
      serviceAccountName: mi-app-sa
      containers:
        - name: nginx
          image: nginx:1.25
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: mi-app-config
                  key: APP_ENV
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: mi-app-secret
                  key: API_KEY
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: html-volume
          configMap:
            name: mi-app-config
            items:
              - key: index.html
                path: index.html

---
apiVersion: v1
kind: Service
metadata:
  name: mi-app-service
  namespace: mi-app
spec:
  type: NodePort
  selector:
    app: mi-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30090

